services:
  - type: web
    name: the-last-note
    runtime: python
    rootDir: perfume_platform
    buildCommand: >
      pip install -r ../requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn perfume_platform.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: the-last-note-db
          property: connectionString

databases:
  - name: the-last-note-db
    plan: free
    databaseName: perfume_platform
    user: perfume_user
